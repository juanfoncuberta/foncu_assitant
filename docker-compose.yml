services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - /opt/foncu_assitant:/opt/foncu_assitant
    environment:
      - DB_PATH=/app/data/assistant.db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
