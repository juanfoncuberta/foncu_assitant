name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma version que el Dockerfile de produccion (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        # Los marcados como 'integration' cargan modelos de SentenceTransformer:
        # demasiado lentos para cada push. Se ejecutan a mano cuando toca.
        run: pytest -m "not integration" -q
        env:
          # El modulo main.py valida el entorno al importarse, asi que necesita
          # valores con la forma correcta aunque no se usen contra ningun servicio.
          TELEGRAM_BOT_TOKEN: "123456789:TEST-token-de-mentira-para-ci-0000000000"
          ANTHROPIC_API_KEY: "sk-ant-test"
          TODOIST_API_TOKEN: "test"
          OWNER_CHAT_ID: "123456789"
